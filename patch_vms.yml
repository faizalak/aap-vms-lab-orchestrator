---
- name: Patch guest VMs
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  tasks:
    - name: Apply security updates (lab - dnf only)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: true
      when: ansible_os_family == "RedHat"
      register: patch_result

    - name: Report patch status
      ansible.builtin.set_stats:
        data:
          patched_hosts: "{{ ansible_play_hosts }}"
          patch_changed: "{{ patch_result.changed | default(false) }}"
